name: CI
run-name: >-
  ${{ (github.event_name == 'push' && format('CI - {0} ({1})', github.event.head_commit.message, github.ref_name)) || (github.event_name == 'pull_request' && format('CI - PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)) || (github.event_name == 'schedule' && 'CI - nightly') || 'CI - manual' }}

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "26"
  PNPM_VERSION: "11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  dependency-review:
    # Enable only when repository security analysis supports dependency review.
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  pr-conventions:
    name: PR Conventions
    if: github.event_name == 'pull_request' && github.repository == 'bookorbit/bookorbit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout trusted pull request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Classify downstream upstream sync
        id: upstream-sync
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail
          args=("$BASE_REPO" "$HEAD_REPO" "$HEAD_BRANCH" "$AUTHOR_ASSOCIATION")
          if git cat-file -e "$PR_BASE_SHA:scripts/classify-upstream-sync-pr.sh" 2>/dev/null; then
            is_sync="$(git show "$PR_BASE_SHA:scripts/classify-upstream-sync-pr.sh" | bash -s -- "${args[@]}")"
          else
            is_sync="$(git show "$PR_HEAD_SHA:scripts/classify-upstream-sync-pr.sh" | bash -s -- "${args[@]}")"
          fi
          echo "is_sync=$is_sync" >> "$GITHUB_OUTPUT"

      - name: Classify Crowdin pull request
        id: crowdin
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          args=("$PR_BASE_SHA" "$PR_HEAD_SHA" "$BASE_REPO" "$HEAD_REPO" "$HEAD_BRANCH")
          if git cat-file -e "$PR_BASE_SHA:scripts/classify-crowdin-pr.sh" 2>/dev/null; then
            is_crowdin="$(git show "$PR_BASE_SHA:scripts/classify-crowdin-pr.sh" | bash -s -- "${args[@]}")"
          else
            is_crowdin="$(git show "$PR_HEAD_SHA:scripts/classify-crowdin-pr.sh" | bash -s -- "${args[@]}")"
          fi
          echo "is_crowdin=$is_crowdin" >> "$GITHUB_OUTPUT"

      - name: Validate PR branch name
        if: github.event.pull_request.user.login != 'dependabot[bot]' && steps.crowdin.outputs.is_crowdin != 'true' && steps.upstream-sync.outputs.is_sync != 'true'
        shell: bash
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          pattern='^BO-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$PR_BRANCH" =~ $pattern ]]; then
            echo "::error::Branch name '$PR_BRANCH' is invalid."
            echo "::error::Use BO-<issue-number>-<short-description> (example: BO-123-fix-reader-sync)."
            exit 1
          fi

      - name: Validate referenced issues exist
        if: github.event.pull_request.user.login != 'dependabot[bot]' && steps.crowdin.outputs.is_crowdin != 'true' && steps.upstream-sync.outputs.is_sync != 'true'
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          validate_issue_exists() {
            local issue_repo="$1"
            local issue_number="$2"
            local reference_context="$3"
            local response_file
            local http_code
            local api_url
            local state
            local reference_label

            response_file="$(mktemp)"
            api_url="https://api.github.com/repos/${issue_repo}/issues/${issue_number}"
            http_code="$(curl -sS -o "${response_file}" -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api_url}")"

            if [[ "${issue_repo}" == "${GH_REPO}" ]]; then
              reference_label="#${issue_number}"
            else
              reference_label="${issue_repo}#${issue_number}"
            fi

            if [[ "${http_code}" != "200" ]]; then
              echo "::error::${reference_context} references ${reference_label}, but it does not exist or is not accessible."
              rm -f "${response_file}"
              return 1
            fi

            if jq -e '.pull_request != null' "${response_file}" > /dev/null; then
              echo "::error::${reference_context} references ${reference_label}, but that number is a pull request, not an issue."
              rm -f "${response_file}"
              return 1
            fi

            state="$(jq -r '.state // "unknown"' "${response_file}")"
            echo "${reference_context}: issue ${reference_label} exists (state=${state})."
            rm -f "${response_file}"
          }

          if [[ "${PR_BRANCH}" =~ ^BO-([0-9]+)- ]]; then
            branch_issue_number="${BASH_REMATCH[1]}"
          else
            echo "::error::Unable to extract issue number from branch '${PR_BRANCH}'."
            exit 1
          fi

          validate_issue_exists "${GH_REPO}" "${branch_issue_number}" "Branch name"

          closing_keyword_pattern='(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)'
          issue_reference_pattern="(^|[^[:alnum:]_])${closing_keyword_pattern}([[:space:]]*:[[:space:]]*|[[:space:]]+)([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[1-9][0-9]*"
          issue_matches="$(printf '%s\n' "${PR_BODY}" | grep -Eio "${issue_reference_pattern}" || true)"
          if [[ -z "${issue_matches}" ]]; then
            echo "::error::PR description must include at least one GitHub closing-keyword issue reference (for example: 'Closes #123', 'Fixes: #123', or 'RESOLVED owner/repo#123')."
            exit 1
          fi

          issue_refs="$(printf '%s\n' "${issue_matches}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/^[^a-z0-9_]*//' \
            | sed -E "s/^${closing_keyword_pattern}([[:space:]]*:[[:space:]]*|[[:space:]]+)//" \
            | sort -u)"
          while IFS= read -r issue_ref; do
            [[ -z "${issue_ref}" ]] && continue

            if [[ "${issue_ref}" =~ ^([a-z0-9_.-]+/[a-z0-9_.-]+)#([1-9][0-9]*)$ ]]; then
              issue_repo="${BASH_REMATCH[1]}"
              issue_number="${BASH_REMATCH[2]}"
            elif [[ "${issue_ref}" =~ ^#([1-9][0-9]*)$ ]]; then
              issue_repo="${GH_REPO}"
              issue_number="${BASH_REMATCH[1]}"
            else
              echo "::error::Unable to parse issue reference '${issue_ref}' in PR description."
              exit 1
            fi

            validate_issue_exists "${issue_repo}" "${issue_number}" "PR description"
          done <<< "${issue_refs}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Enforce localization change policy
        if: steps.upstream-sync.outputs.is_sync != 'true'
        shell: bash
        env:
          IS_CROWDIN: ${{ steps.crowdin.outputs.is_crowdin }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          validator="$RUNNER_TEMP/validate-locale-pr.mjs"
          if git cat-file -e "$PR_BASE_SHA:scripts/validate-locale-pr.mjs" 2>/dev/null; then
            git show "$PR_BASE_SHA:scripts/validate-locale-pr.mjs" > "$validator"
          else
            git show "$PR_HEAD_SHA:scripts/validate-locale-pr.mjs" > "$validator"
          fi
          node "$validator" "$PR_BASE_SHA" "$PR_HEAD_SHA" "$IS_CROWDIN"

      - name: Test PR policy scripts
        run: node --test scripts/validate-locale-pr.test.mjs scripts/classify-upstream-sync-pr.test.mjs

      - name: Lint PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --config commitlint.config.cjs

      - name: Lint PR commit headers
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pnpm exec commitlint --config commitlint.config.cjs --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA" --verbose

  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    needs: [dependency-review]
    timeout-minutes: 10
    if: >
      always() &&
      (needs.dependency-review.result == 'success' || needs.dependency-review.result == 'skipped')
    outputs:
      server: ${{ steps.manual.outputs.server || steps.changes.outputs.server }}
      client: ${{ steps.manual.outputs.client || steps.changes.outputs.client }}
      image: ${{ steps.manual.outputs.image || steps.changes.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Manual and nightly runs include all scopes
        id: manual
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        shell: bash
        run: |
          echo "server=true" >> "$GITHUB_OUTPUT"
          echo "client=true" >> "$GITHUB_OUTPUT"
          echo "image=true" >> "$GITHUB_OUTPUT"

      # For push events dorny/paths-filter diffs github.event.before..github.sha.
      # New-branch pushes (before = 0000...) are handled by treating all files as changed.
      # Force-push edge cases (before SHA no longer reachable) may mark all files changed too.
      - name: Compute changed scopes
        id: changes
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            server:
              - 'server/**'
              - 'workers/**'
              # Server tests assert against the plugin sources, so plugin-only
              # changes can break them.
              - 'koreader-plugin/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'scripts/dev/**'
              - '.github/actions/setup-node-pnpm/action.yml'
              - '.github/workflows/ci.yml'
            client:
              - 'client/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'scripts/dev/**'
              - '.github/actions/setup-node-pnpm/action.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/crowdin-translations.yml'
            image:
              - 'server/**'
              - 'client/**'
              - 'workers/**'
              - 'packages/**'
              - 'koreader-plugin/**'
              - 'patches/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/dev/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'LICENSE'
              - 'NOTICE'
              - 'ADDITIONAL_TERMS.md'
              - '.github/workflows/ci.yml'
              - '.github/workflows/container-image.yml'

      - name: Print change scope
        shell: bash
        run: |
          echo "server=${{ steps.manual.outputs.server || steps.changes.outputs.server }}"
          echo "client=${{ steps.manual.outputs.client || steps.changes.outputs.client }}"
          echo "image=${{ steps.manual.outputs.image || steps.changes.outputs.image }}"

  lint:
    name: Lint (${{ matrix.package_label }})
    runs-on: ubuntu-latest
    needs: [dependency-review, detect-changes]
    timeout-minutes: 10
    if: >
      always() &&
      (needs.dependency-review.result == 'success' || needs.dependency-review.result == 'skipped') &&
      needs.detect-changes.result == 'success'
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        package: [server, client]
        include:
          - package: server
            package_label: Server
          - package: client
            package_label: Client
    permissions:
      contents: read
    steps:
      - name: Check for package changes
        id: has-changes
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          SERVER_CHANGED: ${{ needs.detect-changes.outputs.server }}
          CLIENT_CHANGED: ${{ needs.detect-changes.outputs.client }}
        run: |
          if [[ "$PACKAGE" == "server" && "$SERVER_CHANGED" == "true" ]] || \
             [[ "$PACKAGE" == "client" && "$CLIENT_CHANGED" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.has-changes.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and pnpm
        if: steps.has-changes.outputs.run == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          prefetch: "true"

      - name: Run lint checks
        if: steps.has-changes.outputs.run == 'true'
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if [[ "$PACKAGE" == "server" ]]; then
            pnpm --filter server lint:check
          else
            pnpm --filter client lint:check
          fi

      - name: Run format checks
        if: steps.has-changes.outputs.run == 'true'
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if [[ "$PACKAGE" == "server" ]]; then
            pnpm --filter server format:check
          else
            pnpm --filter client format:check
          fi

  typecheck:
    name: Type Check (${{ matrix.package_label }})
    runs-on: ubuntu-latest
    needs: [dependency-review, detect-changes]
    timeout-minutes: 15
    if: >
      always() &&
      (needs.dependency-review.result == 'success' || needs.dependency-review.result == 'skipped') &&
      needs.detect-changes.result == 'success'
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        package: [server, client]
        include:
          - package: server
            package_label: Server
          - package: client
            package_label: Client
    permissions:
      contents: read
    steps:
      - name: Check for package changes
        id: has-changes
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          SERVER_CHANGED: ${{ needs.detect-changes.outputs.server }}
          CLIENT_CHANGED: ${{ needs.detect-changes.outputs.client }}
        run: |
          if [[ "$PACKAGE" == "server" && "$SERVER_CHANGED" == "true" ]] || \
             [[ "$PACKAGE" == "client" && "$CLIENT_CHANGED" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.has-changes.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and pnpm
        if: steps.has-changes.outputs.run == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          prefetch: "true"

      - name: Run typecheck
        if: steps.has-changes.outputs.run == 'true'
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if [[ "$PACKAGE" == "server" ]]; then
            pnpm --filter server type-check
            pnpm --filter @bookorbit/read-aloud-worker type-check
          else
            pnpm --filter client type-check
          fi

  tests:
    name: Tests (${{ matrix.package_label }})
    runs-on: ubuntu-latest
    needs: [dependency-review, detect-changes]
    timeout-minutes: 20
    if: >
      always() &&
      (needs.dependency-review.result == 'success' || needs.dependency-review.result == 'skipped') &&
      needs.detect-changes.result == 'success'
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        package: [server, client]
        include:
          - package: server
            package_label: Server
          - package: client
            package_label: Client
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Check for package changes
        id: has-changes
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          SERVER_CHANGED: ${{ needs.detect-changes.outputs.server }}
          CLIENT_CHANGED: ${{ needs.detect-changes.outputs.client }}
        run: |
          if [[ "$PACKAGE" == "server" && "$SERVER_CHANGED" == "true" ]] || \
             [[ "$PACKAGE" == "client" && "$CLIENT_CHANGED" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.has-changes.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and pnpm
        if: steps.has-changes.outputs.run == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          prefetch: "true"

      - name: Prepare test report directory
        if: steps.has-changes.outputs.run == 'true'
        shell: bash
        run: mkdir -p "$GITHUB_WORKSPACE/test-results/${{ matrix.package }}"

      - name: Run tests
        if: steps.has-changes.outputs.run == 'true'
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          JUNIT_OUTPUT: ${{ github.workspace }}/test-results/${{ matrix.package }}/junit.xml
        run: |
          if [[ "$PACKAGE" == "server" ]]; then
            pnpm --filter server exec vitest --run --coverage --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit="$JUNIT_OUTPUT"
          else
            pnpm --filter client exec vitest --run --coverage --reporter=default --reporter=junit --outputFile="$JUNIT_OUTPUT"
          fi

      # The worker's control process, runner and resume logic run against a fake pipeline; the real
      # STAlign smoke run stays opt-in (READ_ALOUD_SMOKE=1).
      - name: Run read-aloud worker tests
        if: steps.has-changes.outputs.run == 'true' && matrix.package == 'server'
        shell: bash
        run: |
          pnpm --filter @bookorbit/types build
          pnpm --filter @bookorbit/read-aloud-worker test

      - name: Upload coverage reports to Codecov
        if: steps.has-changes.outputs.run == 'true' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ${{ matrix.package == 'server' && 'server/coverage/lcov.info' || 'client/coverage/lcov.info' }}
          flags: ${{ matrix.package }}
          name: ${{ matrix.package }}-coverage
          verbose: true

      - name: Upload coverage reports to Codecov for fork PR
        if: >
          steps.has-changes.outputs.run == 'true' &&
          env.CODECOV_TOKEN == '' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository &&
          github.event.repository.private == false
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ matrix.package == 'server' && 'server/coverage/lcov.info' || 'client/coverage/lcov.info' }}
          flags: ${{ matrix.package }}
          name: ${{ matrix.package }}-coverage
          verbose: true

      - name: Upload test report artifact
        if: >
          always() &&
          steps.has-changes.outputs.run == 'true' &&
          hashFiles(format('test-results/{0}/junit.xml', matrix.package)) != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ matrix.package }}
          path: test-results/${{ matrix.package }}
          retention-days: 7

  e2e-setup:
    name: Detect E2E Suites
    runs-on: ubuntu-latest
    needs: [detect-changes, lint, typecheck, tests]
    if: >
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'pull_request') &&
      needs.detect-changes.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.tests.result == 'success'
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build suite matrix
        id: build-matrix
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GITHUB_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          MATRIX=$(node scripts/e2e/select-matrix.mjs)
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "selected_suites=$(echo "$MATRIX" | jq -c .)"

  e2e:
    needs: [e2e-setup]
    if: needs.e2e-setup.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.e2e-setup.outputs.matrix) }}
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/e2e-runner.yml
    with:
      suite-id: ${{ matrix.suite.id }}
      check-name: "E2E - ${{ matrix.suite.name }}"
      artifact-name: "e2e-${{ matrix.suite.id }}-report"
      job-timeout-minutes: ${{ matrix.suite.timeout }}

  container-check:
    name: Container (${{ matrix.image }}, ${{ matrix.arch }})
    needs: [detect-changes]
    if: >
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.image == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [app, worker]
        arch: [amd64, arm64]
        include:
          - image: app
            dockerfile: ./Dockerfile
            cache_scope: container-image-yml
          - image: worker
            dockerfile: ./workers/read-aloud/Dockerfile
            cache_scope: worker-image
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: bookorbit-ci:${{ matrix.image }}-${{ matrix.arch }}
          build-args: APP_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}-${{ matrix.arch }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: bookorbit-ci:${{ matrix.image }}-${{ matrix.arch }}
          format: table
          output: trivy-report.txt
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload image scan report
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.image }}-${{ matrix.arch }}
          path: trivy-report.txt
          retention-days: 14
          if-no-files-found: warn

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - dependency-review
      - pr-conventions
      - detect-changes
      - lint
      - typecheck
      - tests
      - e2e-setup
      - e2e
      - container-check
    timeout-minutes: 5
    if: always()
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed or were cancelled."
          exit 1

      - name: CI complete
        run: |
          echo "dependency-review=${{ needs.dependency-review.result }}"
          echo "pr-conventions=${{ needs.pr-conventions.result }}"
          echo "detect-changes=${{ needs.detect-changes.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "typecheck=${{ needs.typecheck.result }}"
          echo "tests=${{ needs.tests.result }}"
          echo "e2e-setup=${{ needs.e2e-setup.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "container-check=${{ needs.container-check.result }}"
