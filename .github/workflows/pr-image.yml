name: PR Image (Manual)
run-name: "PR Image - PR #${{ inputs.pr-number }}"

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to build and publish after successful CI.
        required: true
        type: number

concurrency:
  group: pr-image-${{ inputs.pr-number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Verify PR and CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
    outputs:
      head-sha: ${{ steps.pr.outputs.head_sha }}
      image-tag: ${{ steps.pr.outputs.image_tag }}
      image-name: ${{ steps.pr.outputs.image_name }}
    steps:
      - name: Verify trusted PR and successful CI
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from main."
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::A positive integer pull request number is required."
            exit 1
          fi
          pr_json=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")
          if ! jq -e --arg repo "$GH_REPO" \
            '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repo and (.author_association as $association | ["OWNER", "MEMBER", "COLLABORATOR"] | index($association) != null)' \
            <<< "$pr_json" > /dev/null; then
            echo "::error::Only open pull requests from trusted contributors in this repository targeting main can publish images."
            exit 1
          fi
          head_sha=$(jq -r '.head.sha' <<< "$pr_json")
          success_count=$(gh api --paginate \
            "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${head_sha}&status=completed&event=pull_request" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' \
            | awk '{sum += $1} END {print sum}')
          if [[ "${success_count:-0}" -lt 1 ]]; then
            echo "::error::The current PR commit must pass CI, including the image scan, before publishing."
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "image_tag=pr-${PR_NUMBER}-${head_sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish PR Image
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout verified PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.head-sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}

      - name: Build and push PR image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image-name }}:${{ needs.prepare.outputs.image-tag }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=ci-yml-pr-image
          cache-to: type=gha,mode=max,scope=ci-yml-pr-image

      - name: Publish image summary
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image-name }}:${{ needs.prepare.outputs.image-tag }}
        run: echo "Published \`$IMAGE\` for linux/amd64 and linux/arm64." >> "$GITHUB_STEP_SUMMARY"
